name: "React CI/CD Pipeline"

on:
  push:
    branches:
      - master
    paths:
      - "client/**"
      - ".github/workflows/checkout.yml"
  pull_request:
    branches:
      - master
    paths:
      - "client/**"
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same ref
concurrency:
  group: client-ci-${{ github.ref }}
  cancel-in-progress: true

# The app lives in client/, not at the repo root
defaults:
  run:
    working-directory: client

jobs:
  react-ci-job:
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Set up Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: "Install Dependencies"
        run: npm ci

      - name: "Lint"
        # TODO: 14 pre-existing eslint errors (mostly no-explicit-any) fail this step.
        # Delete this continue-on-error line once they are fixed so lint actually gates the build.
        continue-on-error: true
        run: npm run lint

      - name: "Type-check and Build"
        # `npm run build` is `tsc -b && vite build`, so this type-checks too
        run: npm run build

      - name: "Save Build Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: vite-build
          # paths here are relative to the repo root, not `defaults.run.working-directory`
          path: client/dist
          if-no-files-found: error
          retention-days: 7
